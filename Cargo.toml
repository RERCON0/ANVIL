[package]
name = "anvil"
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
description = "ANVIL — native terminal for Windows by rercon prod."
license = "GPL-3.0-or-later"
build = "build.rs"

[lib]
name = "anvil"
path = "src/lib.rs"

[[bin]]
name = "anvil"
path = "src/main.rs"

[[bin]]
name = "anvil-claude-status"
path = "src/bin/anvil-claude-status.rs"

[[bin]]
name = "anvil-probe"
path = "src/bin/anvil-probe.rs"
test = false

[dependencies]
egui = { version = "0.34.3", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.34.3", features = ["winit", "clipboard", "links"] }
winit = { version = "0.30.5", default-features = false, features = ["rwh_06"] }
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.17"
alacritty_terminal = "0.26"
polling = "3.8"
arboard = { version = "3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
json5 = "0.4"
toml = "1"
log = "0.4"
tempfile = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_Security_Credentials",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
# Generated COM interfaces and progress-sink implementation for fail-closed
# recycling; DirectWrite rasterizes the terminal's hinted glyphs.
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
# The implement macro emits references to windows_core.
windows-core = "0.58"

[dev-dependencies]
# Examples only: the icon generator writes PNG and ICO files.
image = { version = "0.25", default-features = false, features = ["png", "ico"] }

[build-dependencies]
embed-resource = "3"
# Decode the window icon at build time. egui's clipboard stack still uses image
# transitively; this only removes ANVIL's runtime icon decode and direct dependency.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
strip = true
# `lto = true` is already fat. The per-package overrides below only raise the
# terminal engine to -O3: the whole frame path (render, view, style, app,
# workspace) is the root crate, so `opt-level = "z"` compiled it at -Oz for a
# 1.94x slower frame and a longer build. -O2 measured the same as -O3 on the
# frame path.
lto = true
opt-level = 2
codegen-units = 1

[profile.release.package.alacritty_terminal]
opt-level = 3
[profile.release.package.vte]
opt-level = 3
