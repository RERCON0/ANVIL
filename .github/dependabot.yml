version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      graphics-stack:
        patterns: ["egui", "egui_glow", "glow"]
      windows-bindings:
        patterns: ["windows", "windows-core", "windows-sys"]
      rust-patch-minor:
        patterns: ["*"]
        exclude-patterns: ["egui", "egui_glow", "glow", "windows", "windows-core", "windows-sys", "json5"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
