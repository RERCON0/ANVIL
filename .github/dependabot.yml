version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # These crates must share the versions selected by egui_glow/windows.
    # Review new minor families with docs/DEPENDENCIES.md, not in isolation.
    ignore:
      - dependency-name: glow
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      graphics-stack:
        patterns: ["egui", "egui_glow", "glow"]
      windows-bindings:
        patterns: ["windows", "windows-core", "windows-sys"]
      rust-patch-minor:
        patterns: ["*"]
        exclude-patterns: ["egui", "egui_glow", "glow", "windows", "windows-core", "windows-sys", "json5"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
