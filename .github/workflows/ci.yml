name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Formatting, runtime integrity and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Verify pinned ConPTY runtime
        run: python -B scripts/check_conpty.py
      - name: Verify documentation links and heading anchors
        run: python -B scripts/check_docs.py
      - name: Test Aider inference helper without provider access
        run: python -B -m unittest discover -s tests -p 'test_*.py' -v
      # The icon generator test needs fontTools, which is not installed here:
      # it is reported as skipped and only runs on a developer machine.
      - name: Test package check script
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v

  windows:
    name: Windows x64
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      GIT_TERMINAL_PROMPT: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Verify pinned ConPTY runtime
        run: python -B scripts/check_conpty.py
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ hashFiles('vendor/conpty/checksums.sha256') }}
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "true"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check all targets without warnings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test terminal, real ConPTY sessions and Git integration
        run: cargo test --locked --all-targets
      - name: Build portable CI candidate
        run: ./scripts/package.ps1
      - name: Verify package payload and source revision
        run: python -B scripts/check_package.py dist
      - name: Upload unsigned CI candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: anvil-windows-x64-unsigned-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/anvil-*-x64.zip
            dist/SHA256SUMS.txt
